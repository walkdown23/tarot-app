name: 타로 카드 의미 데이터 매일 갱신

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 카드 데이터 갱신 실행
        run: python update_meanings.py

      - name: 변경사항이 있으면 커밋 & 푸시
        run: |
          git config user.name "tarot-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tarot_data_cache.json
          git diff --cached --quiet && echo "변경 없음 - 커밋 스킵" || git commit -m "chore: 타로 카드 의미 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
